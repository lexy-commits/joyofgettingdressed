  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexy Loves Joy · Links</title>
  <meta name="description" content="Style, joy, and getting dressed — find all of Lexy's links here." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #FFF0F7 0%, #FFF9EC 40%, #F0F4FF 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem 3rem;
      font-family: 'DM Sans', sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    .dot { position: fixed; border-radius: 50%; opacity: 0.18; pointer-events: none; z-index: 0; }
    .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .avatar-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 1rem;
      box-shadow: 0 4px 18px rgba(196, 181, 244, 0.38);
      border: 3px solid #FBBFD8;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 600; color: #3D3354; margin-bottom: 0.25rem; text-align: center; }
    .tagline { font-size: 0.85rem; color: #8B7DAA; font-weight: 400; text-align: center; margin-bottom: 2rem; letter-spacing: 0.02em; }
    .links-stack { display: flex; flex-direction: column; gap: 13px; width: 100%; max-width: 400px; }
    .link-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 18px; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; border: 1.5px solid transparent; }
    .link-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
    .link-card.youtube { background: #FFF0F4; border-color: #FBBFD8; }
    .link-card.ltk     { background: #FDF4FF; border-color: #DDB8F0; }
    .link-card.amazon  { background: #FFFAEC; border-color: #FAD88A; }
    .link-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .link-card.youtube .link-icon { background: #FBBFD8; }
    .link-card.ltk     .link-icon { background: #DDB8F0; }
    .link-card.amazon  .link-icon { background: #FAD88A; }
    .link-text { flex: 1; }
    .link-title { font-weight: 500; font-size: 0.95rem; margin: 0 0 2px; color: #3D3354; }
    .link-sub { font-size: 0.75rem; color: #9B8FB5; margin: 0; }
    .link-arrow { font-size: 1.1rem; color: #C5AFDD; flex-shrink: 0; }
    .footer-text { margin-top: 2.2rem; font-size: 0.75rem; color: #BBA8D6; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; }
  </style>
</head>
